- name: time_series_forecast_agent
  _target_: recipe.time_series_forecast.time_series_forecast_agent_flow.TimeSeriesForecastAgentFlow
  max_steps: 5
  max_parallel_calls: 5
  lookback_window: 96
  forecast_horizon: 96
  auto_finalize_prediction: false
  allow_tool_fallback: false
  allowed_predict_model_names: [patchtst, itransformer, arima, chronos2]
